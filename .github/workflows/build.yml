name: Build P31n firmware

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      firmware:
        description: Firmware to build
        type: choice
        required: true
        default: public
        options: [public, personal]

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: firmware
    container:
      # ZMK's Zephyr 4.1 build image, pinned to an immutable digest.
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out P31n
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build public firmware
        if: inputs.firmware != 'personal'
        run: ./scripts/build.sh public

      - name: Install age
        if: inputs.firmware == 'personal'
        run: |
          tool_dir=$(mktemp -d)
          cd "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output age.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz' | sha256sum --check
          tar -xzf age.tar.gz age/age
          echo "$tool_dir/age" >> "$GITHUB_PATH"

      - name: Build and encrypt personal firmware
        if: inputs.firmware == 'personal'
        env:
          P31N_LOCAL_MACROS_B64: ${{ secrets.P31N_LOCAL_MACROS_B64 }}
        run: |
          if [[ -z "$P31N_LOCAL_MACROS_B64" ]]; then
            echo 'Set the P31N_LOCAL_MACROS_B64 secret in the firmware environment.' >&2
            exit 1
          fi
          macro_file=boards/shields/p31n/p31n-local-macros.dtsi
          trap 'rm -f "$macro_file" dist/p31n-personal.uf2' EXIT
          umask 077
          printf '%s' "$P31N_LOCAL_MACROS_B64" | base64 --decode > "$macro_file"
          unset P31N_LOCAL_MACROS_B64
          ./scripts/build.sh personal
          age -R .github/p31n-age-recipients.txt -o dist/p31n-personal.uf2.age dist/p31n-personal.uf2

      - name: Upload public UF2
        if: inputs.firmware != 'personal'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p31n-public
          path: dist/p31n-public.uf2
          if-no-files-found: error

      - name: Upload encrypted personal UF2
        if: inputs.firmware == 'personal'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p31n-personal-encrypted
          path: dist/p31n-personal.uf2.age
          if-no-files-found: error
